[project]
name = "dance-pulse"
version = "0.1.0"
description = "Dance Pulse — Telegram bot that polls dance-school students about class attendance"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "apscheduler>=3.10,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2024.1",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
