[project]
name = "dance-pulse"
version = "0.1.0"
description = "Dance Pulse — Telegram bot that polls dance-school students about class attendance"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.14,<4",
    "aiogram-dialog>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "apscheduler>=3.10,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2024.1",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
]
# Живые e2e через настоящий Telegram (см. e2e/README.md). Не нужны для обычной
# разработки — ставь отдельно: pip install -e ".[dev,e2e]".
e2e = [
    "telethon>=1.36,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "schema_mutating: тест меняет DDL (регрессии миграций) — conftest пересоздаёт схему до и после",
]
